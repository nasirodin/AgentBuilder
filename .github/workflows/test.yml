name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # bwrap for the sandbox integration tests; they skip themselves without it.
      # Ubuntu 24.04's AppArmor blocks unprivileged user namespaces, which bwrap needs.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest
        run: uv run --no-sync pytest -ra
