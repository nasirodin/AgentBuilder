name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Only the dev group: ruff is pinned in uv.lock, so CI and local runs use the same version.
      - name: Install ruff
        run: uv sync --locked --only-group dev

      - name: Ruff check
        run: uv run --no-sync ruff check --output-format=github .

      - name: Ruff format
        run: uv run --no-sync ruff format --check --diff .
