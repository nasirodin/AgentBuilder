[project]
name = "agentbuilder"
version = "0.1.0"
description = "Terminal app that builds, probes and fixes Pydantic AI agents in a sandbox"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[anthropic,google]>=2.59.0",
    "pydantic-settings>=2.16.1",
    "textual>=4",
]

[project.scripts]
agentbuilder = "agentbuilder.__main__:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
