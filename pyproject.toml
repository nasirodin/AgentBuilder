[project]
name = "agentbuilder"
version = "0.1.0"
description = "Terminal app that builds, probes and fixes Pydantic AI agents in a sandbox"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[anthropic,google]>=2.59.0",
    "pydantic-settings>=2.16.1",
    "textual>=4",
]

[project.scripts]
agentbuilder = "agentbuilder.__main__:main"

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyright]
# Standard mode; missing stubs are noise for the untyped deps we use.
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.format]
# Leave hand-formatted code snippets in Markdown (design docs, README) alone.
exclude = ["*.md"]

[tool.ruff.lint]
# Explicit list so a ruff upgrade can't silently change what CI enforces.
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # bugbear
    "BLE",     # blind except
    "SIM",     # simplify
    "RUF",     # ruff-specific
]
